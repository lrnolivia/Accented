name: Accented checks

on:
  push:
    branches: [main, accented/flatpak]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accented-checks-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 10
    steps:
      - name: Install native test dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq git python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb xauth dbus-x11 imagemagick fonts-cantarell
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Unit tests and syntax
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q accented launch.py install.py
      - name: Screen picker D-Bus protocol
        run: dbus-run-session python3 tests/smoke_portal.py
      - name: Native window, interaction, sizing, and appearance
        env:
          GSK_RENDERER: cairo
          NO_AT_BRIDGE: "1"
        run: |
          mkdir -p evidence
          xvfb-run -a -s '-screen 0 1000x1000x24' dbus-run-session sh -c '
            python3 tests/smoke_ui.py --capture > evidence/native.log 2>&1 &
            pid=$!
            for i in $(seq 1 30); do
              if grep -q CAPTURE_READY evidence/native.log; then break; fi
              if ! kill -0 "$pid" 2>/dev/null; then cat evidence/native.log; wait "$pid"; exit 1; fi
              sleep 1
            done
            grep -q CAPTURE_READY evidence/native.log
            test -s evidence/Accented-dark.png
            wait "$pid"
          '
          cat evidence/native.log
      - name: Build installer evidence
        run: |
          VERSION=$(python3 -c 'from accented import __version__; print(__version__)')
          python3 tools/build_installer.py "evidence/Accented-${VERSION}.run"
          sha256sum "evidence/Accented-${VERSION}.run" > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Accented-evidence
          path: evidence/
          retention-days: 7

  packages:
    strategy:
      matrix:
        include:
          - format: deb
            image: debian:trixie-slim
          - format: rpm
            image: fedora:44
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Package dependencies
        run: |
          if [ "${{ matrix.format }}" = deb ]; then
            apt-get update -qq
            apt-get install -y python3 dpkg-dev python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gsettings-desktop-schemas desktop-file-utils
          else
            dnf install -y python3 rpm-build python3-gobject gtk4 libadwaita gsettings-desktop-schemas desktop-file-utils
          fi
      - name: Build and validate package lifecycle
        run: |
          python3 tools/build_packages.py "${{ matrix.format }}"
          if [ "${{ matrix.format }}" = deb ]; then
            dpkg-deb --info dist/*.deb
            dpkg-deb --contents dist/*.deb
            dpkg -i dist/*.deb
          else
            rpm -qip dist/*.rpm
            rpm -qlp dist/*.rpm
            rpm -i dist/*.rpm
          fi
          accented --version
          desktop-file-validate /usr/share/applications/com.loew.accented.desktop
          test -f /usr/share/icons/hicolor/512x512/apps/com.loew.accented.png
          accented --uninstall | grep 'package manager'
          mkdir -p /root/.config/accented
          printf 'retained' > /root/.config/accented/package-test
          if [ "${{ matrix.format }}" = deb ]; then dpkg -r accented; else rpm -e accented; fi
          test ! -e /usr/bin/accented
          test "$(cat /root/.config/accented/package-test)" = retained
      - uses: actions/upload-artifact@v7
        with:
          name: accented-${{ matrix.format }}
          path: dist/*

  flatpak:
    uses: ./.github/workflows/flatpak.yml

  release:
    needs: [native, packages, flatpak]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: accented-*
          merge-multiple: true
          path: release
      - name: Publish native packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c 'from accented import __version__; print(__version__)')
          set -euo pipefail
          TAG="v${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Release tag must match the application version." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; existing downloads are preserved."
            exit 0
          fi
          cd release
          test -s Accented-review.flatpak
          mv Accented-review.flatpak "Accented-${VERSION}.flatpak"
          sha256sum *.deb *.rpm *.flatpak > SHA256SUMS
          printf '%s\n' 'Native DEB/RPM packages plus a sandboxed GTK-accent Flatpak bundle. The Flatpak does not modify GNOME Shell accents and is not a Flathub listing or automatic repository feed. See README for restoration and migration guidance. All package and native runtime checks passed for this source.' > RELEASE-NOTES.txt
          gh release create "$TAG" *.deb *.rpm *.flatpak SHA256SUMS --target "$GITHUB_SHA" --title "Accented ${VERSION}" --notes-file RELEASE-NOTES.txt
